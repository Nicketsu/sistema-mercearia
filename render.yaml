services:
  - type: web
    name: sistema-mercearia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: SUPABASE_DB_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
